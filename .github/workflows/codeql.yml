# CodeQL (AC-SEC-4): Python and TypeScript analysis on every PR and push to the integration branch. The job fails
# when any result has a security severity of 7.0 or more (high/critical); results also reach code scanning.
name: codeql

on:
  pull_request:
    branches: [claude/eloquent-hypatia-aa3577]
  push:
    branches: [claude/eloquent-hypatia-aa3577]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        id: analyze
        with:
          category: /language:${{ matrix.language }}
          output: sarif-results
      - name: Block on high and critical results
        run: python3 infra/ci/sarif_gate.py sarif-results 7.0
