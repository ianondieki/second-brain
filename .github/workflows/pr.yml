# PR and integration-branch CI (REQ-FND-01, REQ-FND-03). Spec: docs/spec/08 "Testing & CI".
# Every test step on Linux runs as the unprivileged `sandbox` user inside the egress lock (infra/ci/egress-lock.sh),
# after dependencies and images are fetched: no job in this file can reach an LLM, email, WhatsApp or payment
# provider (AC-SEC-5). Only nightly.yml's evals job may reach the Anthropic API. Scanners block on high/critical
# (AC-SEC-4) and never set continue-on-error. backend/tests/unit/ci/test_workflows.py asserts both rules.
name: pr

on:
  pull_request:
    branches: [claude/eloquent-hypatia-aa3577]
  push:
    branches: [claude/eloquent-hypatia-aa3577]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.18"
  UV_PYTHON_PREFERENCE: only-system   # the venv must point at setup-python's world-readable interpreter
  UV_FROZEN: "1"
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers

jobs:
  hygiene:
    name: hygiene (AC-HYG-01..06)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Hygiene checks
        run: bash scripts/check_hygiene.sh

  legacy:
    name: legacy suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"   # D-23: the local companion runs on 3.13
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the companion's dependencies
        run: python -m pip install -r requirements.txt
      - name: cloudflared stub on PATH (D-13)
        shell: bash
        # adviser.__main__.check() only tests that a cloudflared file exists (shutil.which / os.path.isfile).
        # The tests pass it an explicit env dict, so ADVISER_CLOUDFLARED is not read; a stub on PATH is.
        run: |
          stub_dir="$RUNNER_TEMP/cloudflared-stub"
          mkdir -p "$stub_dir"
          if [ "$RUNNER_OS" = "Windows" ]; then
            : > "$stub_dir/cloudflared.exe"
          else
            printf '#!/bin/sh\nexit 0\n' > "$stub_dir/cloudflared"
            chmod +x "$stub_dir/cloudflared"
          fi
          echo "$stub_dir" >> "$GITHUB_PATH"
      - name: Runner self-tests
        run: python -m unittest discover -s scripts -t scripts
      - name: Egress lock (Linux)
        if: runner.os == 'Linux'
        run: |
          bash infra/ci/egress-lock.sh
          infra/ci/sandboxed.sh python infra/ci/egress_probe.py
      - name: Legacy suite, full (Windows, AC-REM-4/a)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -t .
      - name: Legacy suite, skip list applied (Linux, AC-REM-4/a)
        if: runner.os == 'Linux'
        run: infra/ci/sandboxed.sh python scripts/run_legacy_tests.py

  legacy-linux-full:
    # D-12: the full suite on ubuntu without the skip list, informational, so the list keeps matching reality.
    name: legacy suite, ubuntu, no skip list (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: cloudflared stub on PATH (D-13)
        run: |
          mkdir -p "$RUNNER_TEMP/cloudflared-stub"
          printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/cloudflared-stub/cloudflared"
          chmod +x "$RUNNER_TEMP/cloudflared-stub/cloudflared"
          echo "$RUNNER_TEMP/cloudflared-stub" >> "$GITHUB_PATH"
      - run: bash infra/ci/egress-lock.sh
      - name: Legacy suite without the skip list
        run: infra/ci/sandboxed.sh python scripts/run_legacy_tests.py --no-skip --verbose

  backend:
    name: backend (ruff, mypy --strict, OpenAPI drift, pytest incl. migrations and RLS)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_PASSWORD: ci-throwaway-postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_ADMIN_URL: postgresql+psycopg://postgres:ci-throwaway-postgres@127.0.0.1:5432/postgres
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install backend dependencies (locked)
        working-directory: backend
        run: uv sync --python 3.12
      - name: Egress lock and probe
        run: |
          bash infra/ci/egress-lock.sh
          infra/ci/sandboxed.sh python infra/ci/egress_probe.py
      - name: make check-backend (offline)
        run: infra/ci/sandboxed.sh env UV_OFFLINE=1 make check-backend

  frontend:
    name: frontend (eslint, tsc, vitest, API types drift)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies (locked)
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Egress lock
        run: bash infra/ci/egress-lock.sh
      - name: make check-frontend (offline)
        run: infra/ci/sandboxed.sh env NEXT_TELEMETRY_DISABLED=1 make check-frontend

  e2e:
    name: Playwright against the compose stack (X1-1)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: CI-only environment files (throwaway random values)
        run: bash infra/ci/make-env.sh
      - name: Install frontend dependencies and Chromium
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build and start the stack
        run: docker compose --env-file infra/.env -f infra/docker-compose.dev.yml up -d --build --wait
      - name: Egress lock (host and containers)
        run: bash infra/ci/egress-lock.sh
      - name: Playwright (mobile 360 px and desktop, axe)
        run: infra/ci/sandboxed.sh make check-e2e
      - name: Stack logs on failure
        if: failure()
        run: docker compose --env-file infra/.env -f infra/docker-compose.dev.yml logs --tail=200
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  scanners:
    name: scanners (gitleaks, pip-audit, npm audit, osv-scanner, Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks scans the whole history
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: gitleaks (any finding fails)
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --exit-code 1 --config /repo/.gitleaks.toml /repo
      - name: pip-audit (backend lockfile; any known vulnerability fails)
        working-directory: backend
        run: |
          uv export --no-hashes --no-emit-project --format requirements.txt > "$RUNNER_TEMP/backend-requirements.txt"
          uvx --from pip-audit==2.10.1 pip-audit --strict --disable-pip -r "$RUNNER_TEMP/backend-requirements.txt"
      - name: npm audit (frontend; high and critical fail)
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: osv-scanner (lockfiles; any known vulnerability fails unless listed in osv-scanner.toml)
        run: >-
          docker run --rm -v "$PWD:/src" -w /src
          ghcr.io/google/osv-scanner:v2.6.0@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa
          scan source --config=/src/osv-scanner.toml --lockfile=/src/backend/uv.lock
          --lockfile=/src/frontend/package-lock.json
      - name: Trivy (vulnerabilities, secrets, IaC misconfigurations; high and critical fail)
        run: >-
          docker run --rm -v "$PWD:/src" -w /src
          ghcr.io/aquasecurity/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed
          --skip-dirs legacy --skip-dirs frontend/node_modules --skip-dirs backend/.venv /src
