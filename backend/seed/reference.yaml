# Public Holidays Act (Cap. 110). Section 4: a Part I holiday falling on a Sunday moves to the next
# non-holiday day (normally Monday); Saturday holidays are NOT moved (no rule covers Saturday).
# Islamic holidays (Idd-ul-Fitr, Idd-ul-Azha) are only gazetted once the Chief Kadhi confirms the
# moon sighting; dates shown for years/holidays not yet gazetted are calendar-projection estimates
# and carry provisional: true.
holidays:
  # 2026 — gazetted / fixed
  - {date: 2026-01-01, name: New Year's Day, observed: 2026-01-01, provisional: false, source_url: "https://calendarific.com/holidays/2026/KE"}
