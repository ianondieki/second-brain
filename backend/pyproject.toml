[project]
name = "bridge"
version = "0.1.0"
description = "Bridge (working name): hosted developer and organisation platform (docs/spec/)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.53",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "email-validator>=2.3",
    "sqlalchemy[asyncio]>=2.0.54",
    "psycopg[binary,pool]>=3.3",
    "alembic>=1.20",
    "procrastinate>=3.10",
    "structlog>=26.1",
    "argon2-cffi>=25.1",
    "pyotp>=2.10",
    "cryptography>=45",
    "httpx>=0.28",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7",
    "hypothesis>=6.168",
    "respx>=0.23",
    "testcontainers[postgres]>=4.15",
    "mypy>=2.3",
    "ruff>=0.16.8",
    "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bridge"]

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "C4", "SIM", "RUF", "PT", "DTZ", "T20"]
ignore = ["S101"]  # assert is how pytest checks

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "S603", "S608"]  # fixture passwords, random ids, subprocess on repo scripts, SQL from table names
"alembic/**" = ["S608"]
"src/bridge/**/__main__.py" = ["T201"]  # command-line entry points print their result

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["bridge", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["procrastinate.*", "testcontainers.*", "pyotp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
markers = [
    "integration: needs PostgreSQL (TEST_DATABASE_URL or Docker for testcontainers)",
]
filterwarnings = ["error::DeprecationWarning:bridge.*"]

[tool.coverage.run]
source = ["bridge"]
branch = true
