# Today's five: the curated source list (REQ-DEV-01; D-59; docs/platform/tasks/P22.md section A).
#
# The quiz_generation task (ai/models.yaml) is sent a sample of these pages each night (bridge/quiz/sources.py: spread
# over the topics, rotated by the Nairobi date) and picks a source id per question; it never writes a URL. The title
# and URL a question shows are copied from here at generation, so a question's "Source" link is always one of these.
#
# Rules for an entry (checked by bridge.quiz.sources.load_sources; a bad entry refuses the whole file):
# - official project, standards-body or regulator documentation only (python.org, MDN, postgresql.org, git-scm.com,
#   man7.org's Linux man-pages project, IETF RFCs, W3C, OWASP, kubernetes.io, developer.android.com, ...); never a
#   news site, a vendor blog or a tutorial site;
# - a stable page: a documentation root or a long-lived reference page. Each URL below answered 200 on 2026-10-05;
#   where the site redirected, the final URL is written here, except Django's own stable alias (/en/stable/);
# - id: short and stable (a-z, 0-9, dashes; at most 40 characters): stored questions keep it, so never reuse one;
# - host: the URL's host exactly; topic: one of `topics`; title: plain Latin text, at most 160 characters.
