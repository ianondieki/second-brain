# Local development stack (REQ-FND-02, docs/spec/08). Start with `make dev` from the repo root.
# Ports bind to 127.0.0.1 only. Values come from infra/.env (copy infra/.env.example) and backend/.env.
name: bridge

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://bridge_app:${BRIDGE_APP_PASSWORD:?set in infra/.env}@postgres:5432/bridge
  DATABASE_OWNER_URL: postgresql+psycopg://bridge_owner:${BRIDGE_OWNER_PASSWORD:?set in infra/.env}@postgres:5432/bridge
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  EMAIL_PROVIDER: smtp
  # SeaweedFS runs without S3 authentication in dev; boto3 still signs requests, so any credentials do.
  OBJECT_STORE: s3
  S3_ENDPOINT_URL: http://s3:8333
  S3_ACCESS_KEY_ID: dev
  S3_SECRET_ACCESS_KEY: dev
  # Next.js forwards a client-supplied X-Forwarded-For unchanged, so the web hop is not trusted in dev (all local
  # users share one throttle key). Phase 8: Caddy overwrites XFF and TRUSTED_PROXIES lists Caddy (and Cloudflare).
  TRUSTED_PROXIES: 127.0.0.1

x-backend: &backend
  build: ../backend
  env_file: ../backend/.env
  environment: *backend-env
  depends_on:
    postgres:
      condition: service_healthy
    mailpit:
      condition: service_started

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in infra/.env}
      BRIDGE_OWNER_PASSWORD: ${BRIDGE_OWNER_PASSWORD:?set in infra/.env}
      BRIDGE_APP_PASSWORD: ${BRIDGE_APP_PASSWORD:?set in infra/.env}
      TZ: Africa/Nairobi
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres:/bridge-sql:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bridge"]
      interval: 3s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.31.2
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

  s3:
    # S3-compatible stand-in for AWS S3 (D-24: MinIO's image was withdrawn): the evidence, kyc-review and uploads
    # buckets (bridge/storage/objects.py).
    image: chrislusf/seaweedfs:4.47
    command: ["server", "-s3", "-dir=/data", "-ip.bind=0.0.0.0"]
    volumes: [s3data:/data]
    ports: ["127.0.0.1:8333:8333"]

  clamav:
    # Attachment scanning from Phase 2; needs ~1.3 GB RAM, so it starts only with `make dev-full`.
    image: clamav/clamav:1.5.4
    profiles: [full]
    mem_limit: 2g
    ports: ["127.0.0.1:3310:3310"]

  migrate:
    <<: *backend
    # Creates the object-store buckets before api and worker start (never at first use; idempotent). The provenance
    # signing key's public half is published once PROVENANCE_SIGNING_KEY is set (skipped otherwise).
    command: ["sh", "-c", "alembic upgrade head && python -m bridge.seed && python -m bridge.storage ensure-buckets && python -m bridge.provenance register-key --if-configured"]
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      s3:
        condition: service_started
    restart: "no"

  api:
    <<: *backend
    environment:
      <<: *backend-env
      # The API never signs and never reads the audit chains as audit_reader: it gets neither secret, even when
      # backend/.env sets them for the worker (an empty value is unset; bridge/config.py).
      PROVENANCE_SIGNING_KEY: ""
      AUDIT_READER_DATABASE_URL: ""
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["procrastinate", "--app=bridge.jobs.app.app", "worker"]

  web:
    build:
      context: ../frontend
      args:
        API_ORIGIN: http://api:8000   # baked into the rewrites at build time
    environment:
      API_ORIGIN: http://api:8000
      # Which session cookie name the web server reads; must equal the API's COOKIE_SECURE (backend/.env).
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on:
      api:
        condition: service_healthy
    ports: ["127.0.0.1:3000:3000"]

volumes:
  pgdata:
  s3data:
